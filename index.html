<head>

<link rel="icon" href="icon.svg" type="image/svg+xml">

<meta name="color-scheme" content="light dark">
<title>STENOGRAMA</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1b19;--mut:#6a665e;--card:#fff;--bd:#d9d5ca;--ac:#1f5f8b;--acf:#fff;--ok:#2d7a3e;--er:#b3261e;--cur:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#a29e94;--card:#211f1c;--bd:#3a3732;--ac:#6fb1e0;--acf:#0d1b26;--ok:#7fcf92;--er:#ff8a80;--cur:#4a4217}}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:60rem;margin:0 auto;padding:1rem}
h1{font-size:1.6rem;margin:.4rem 0 0;letter-spacing:.04em}
.sub{color:var(--mut);margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:.8rem;padding:1rem;margin:0 0 1rem}
.card h2{font-size:1.05rem;margin:0 0 .6rem}
#drop{border:2px dashed var(--bd);border-radius:.8rem;padding:1.4rem 1rem;text-align:center;cursor:pointer}
#drop.on,#drop:focus-visible{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
#drop b{display:block;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:end}
.row>label{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;color:var(--mut);min-width:12rem;flex:1}
select,button,input[type=text]{font:inherit;color:var(--fg)}
select{background:var(--card);border:1px solid var(--bd);border-radius:.5rem;padding:.5rem;min-height:2.6rem}
button{background:var(--card);border:1px solid var(--bd);border-radius:.5rem;padding:.5rem .9rem;min-height:2.6rem;cursor:pointer}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,[contenteditable]:focus-visible,#drop:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chk{display:flex;gap:.5rem;align-items:center;font-size:.95rem;margin:.5rem 0 0}
.chk input{width:1.15rem;height:1.15rem}
progress{width:100%;height:1rem;margin:.6rem 0 .2rem}
#status{margin:.3rem 0;min-height:1.5rem}
#status.er{color:var(--er)}
.mut{color:var(--mut);font-size:.9rem}
audio{width:100%;margin-top:.7rem}
#list{max-height:34rem;overflow:auto;border:1px solid var(--bd);border-radius:.6rem}
.seg{display:flex;gap:.6rem;padding:.35rem .6rem;border-bottom:1px solid var(--bd)}
.seg:last-child{border-bottom:0}
.seg.cur{background:var(--cur)}
.seg .ts{flex:none;min-height:0;padding:.1rem .45rem;font-variant-numeric:tabular-nums;font-size:.85rem;align-self:flex-start;margin-top:.1rem}
.seg .tx{flex:1;outline:0;white-space:pre-wrap;word-break:break-word;border-radius:.3rem;padding:.1rem .2rem}
.seg .tx:focus{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin:.7rem 0 0}
details{margin-top:.8rem}
summary{cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:.5rem;padding:.6rem;font-size:.82rem}
dialog{border:1px solid var(--bd);border-radius:.8rem;background:var(--card);color:var(--fg);max-width:26rem}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .bar{justify-content:flex-end}
.vh{position:absolute;left:-9999px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem}
.top label{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><h1>STENOGRAMA</h1><label><span data-i18n="uiLang"></span><select id="ui"><option value="ro">Română</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option><option value="hu">Magyar</option></select></label></div>
<p class="sub" data-i18n="sub"></p>

<section class="card" aria-labelledby="h1a">
<h2 id="h1a" data-i18n="h1a"></h2>
<div id="drop" role="button" tabindex="0" aria-describedby="dropinfo">
<b data-i18n="dropT"></b>
<span class="mut" id="dropinfo" data-i18n="dropInfo"></span>
</div>
<input id="file" class="vh" type="file" accept="audio/*,video/mp4,video/webm,.mp3,.wav,.m4a,.ogg,.opus,.flac,.aac,.mp4,.mpeg,.mpga" data-i18n-aria="ariaFile">
<p id="finfo" class="mut" aria-live="polite"></p>
<audio id="player" controls hidden></audio>
</section>

<section class="card" aria-labelledby="h2a">
<h2 id="h2a" data-i18n="h2a"></h2>
<div class="row">
<label><span data-i18n="lblModel"></span>
<select id="model">
<option value="tiny" data-i18n="mTiny"></option>
<option value="base" data-i18n="mBase"></option>
<option value="small" selected data-i18n="mSmall"></option>
<option value="turbo" data-i18n="mTurbo"></option>
</select></label>
<label><span data-i18n="lblLang"></span>
<select id="lang">
<option value="romanian" selected>Română</option>
<option value="auto" data-i18n="auto"></option>
<option value="english">English</option>
<option value="french">Français</option>
<option value="german">Deutsch</option>
<option value="spanish">Español</option>
<option value="italian">Italiano</option>
<option value="hungarian">Magyar</option>
</select></label>
</div>
<label class="chk"><input type="checkbox" id="hallu" checked> <span data-i18n="hallu"></span></label>
<p class="mut" id="devinfo"></p>
<div class="bar">
<button id="go" class="pri" disabled data-i18n="go"></button>
<button id="stop" disabled data-i18n="stop"></button>
<button id="clear" disabled data-i18n="clear"></button>
</div>
<progress id="prog" max="1000" value="0" hidden></progress>
<div id="status" role="status" aria-live="polite"></div>
<details id="errbox" hidden><summary data-i18n="errSum"></summary><pre id="errtxt"></pre><button id="errcopy" data-i18n="errCopy"></button></details>
</section>

<section class="card" aria-labelledby="h3a">
<h2 id="h3a" data-i18n="h3a"></h2>
<p class="mut" data-i18n="hint3"></p>
<div id="list" tabindex="-1" data-i18n-aria="ariaSegs"></div>
<p id="count" class="mut" aria-live="polite"></p>
<label class="chk"><input type="checkbox" id="withts"> <span data-i18n="withts"></span></label>
<div class="bar">
<button id="cp" disabled data-i18n="cp"></button>
<button id="dtxt" disabled>.txt</button>
<button id="dsrt" disabled>.srt</button>
<button id="dvtt" disabled>.vtt</button>
<button id="ddocx" disabled>.docx</button>
</div>
</section>
<p class="mut"><span data-i18n="foot1"></span> <a href="https://huggingface.co/docs/transformers.js" rel="noopener noreferrer" target="_blank">transformers.js</a> <span data-i18n="foot2"></span></p>
</main>

<dialog id="dlg"><p id="dlgq"></p><div class="bar" id="dlgb"></div></dialog>

/* ===== Utilitare pure ===== */
function pad(n,w){return String(n).padStart(w||2,'0')}
function fmtT(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?pad(h)+':':'')+pad(m)+':'+pad(s%60)}
function fmtSrt(s,sep){s=Math.max(0,s);const ms=Math.round(s*1000),h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),x=Math.floor(ms%60000/1000);return pad(h)+':'+pad(m)+':'+pad(x)+(sep||',')+pad(ms%1000,3)}
function fmtDur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' '+tr('uH')+' '+pad(m)+' '+tr('uM'):m+' '+tr('uM')+' '+pad(s%60)+' '+tr('uS')}
function fmtMB(b){return b>=1073741824?(b/1073741824).toFixed(2)+' GB':(b/1048576).toFixed(b>=10485760?0:1)+' MB'}

function resampleMono(mono,from){
 if(from===SR)return mono;
 const ratio=from/SR,n=Math.floor(mono.length/ratio),out=new Float32Array(n),L=mono.length;
 if(ratio>1){
  /* filtru sinc cu fereastră Hann (3 lobi) ca să nu apară aliasing la 48/44,1 kHz → 16 kHz */
  const K=3,half=Math.ceil(K*ratio),w=new Float32Array(2*half+1);
  for(let j=-half;j<=half;j++){const x=j/ratio,sc=x===0?1:Math.sin(Math.PI*x)/(Math.PI*x);w[j+half]=sc*(0.5+0.5*Math.cos(Math.PI*j/(half+1)))}
  for(let i=0;i<n;i++){
   const c=Math.round(i*ratio);let acc=0,ws=0;
   const lo=Math.max(0,c-half),hi=Math.min(L-1,c+half);
   for(let j=lo;j<=hi;j++){const k=w[j-c+half];acc+=mono[j]*k;ws+=k}
   out[i]=ws?acc/ws:0;
  }
 }else{for(let i=0;i<n;i++){const p=i*ratio,a=Math.floor(p),f=p-a,x=mono[a],y=a+1<L?mono[a+1]:x;out[i]=x+(y-x)*f}}
 return out;
}
function audioBufferToMono16k(buf){
 const ch=buf.numberOfChannels,n=buf.length,m=new Float32Array(n);
 for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)m[i]+=d[i]/ch}
 return resampleMono(m,buf.sampleRate);
}
function rms(a,s,e){let t=0;s=s||0;e=e===undefined?a.length:e;for(let i=s;i<e;i++)t+=a[i]*a[i];return Math.sqrt(t/Math.max(1,e-s))}
/* alege un punct de tăiere în cea mai liniștită fereastră din jurul lui nominal (în eșantioane) */
function pickCut(audio,nominal){
 const win=Math.floor(0.25*SR),hop=Math.floor(0.05*SR),lo=Math.max(win,nominal-8*SR),hi=Math.min(audio.length-win,nominal+8*SR);
 if(hi<=lo)return Math.min(audio.length,nominal);
 let best=lo,bv=Infinity;
 for(let p=lo;p<=hi;p+=hop){const v=rms(audio,p,p+win);if(v<bv){bv=v;best=p}}
 return best+(win>>1);
}

/* ===== MP3: indexare pe cadre ===== */
const BR1=[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320],BR2=[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
function parseMp3Header(b0,b1,b2){
 if(b0!==0xFF||(b1&0xE0)!==0xE0)return null;
 const ver=(b1>>3)&3,layer=(b1>>1)&3;
 if(ver===1||layer!==1)return null;           /* doar MPEG 1/2/2.5, Layer III */
 const bi=(b2>>4)&15,si=(b2>>2)&3,pd=(b2>>1)&1;
 if(bi===0||bi===15||si===3)return null;
 let sr,br,spf,len;
 if(ver===3){sr=[44100,48000,32000][si];br=BR1[bi];spf=1152;len=Math.floor(144000*br/sr)+pd}
 else{sr=[22050,24000,16000][si]/(ver===0?2:1);br=BR2[bi];spf=576;len=Math.floor(72000*br/sr)+pd}
 return{ver,sr,spf,len};
}
async function mp3Index(file){
 const BLK=4<<20,size=file.size;let bs=-1,bb=new Uint8Array(0);
 async function hdr(i){
  if(i+4>size)return null;
  if(i<bs||i+4>bs+bb.length){bs=i;bb=new Uint8Array(await file.slice(i,Math.min(size,i+BLK)).arrayBuffer())}
  if(i+4>bs+bb.length)return null;
  const o=i-bs;return parseMp3Header(bb[o],bb[o+1],bb[o+2]);

async function wavInfo(file){

  if(id===0x666d7420){

   let tag=f.getUint16(0,true);const ch=f.getUint16(2,true),sr=f.getUint32(4,true),bits=f.getUint16(14,true);

   if(!ok||!fmt.ch||!fmt.sr)return null;
   const fs=fmt.ch*fmt.bits/8;
   return{...fmt,dataStart:ds,frames:Math.floor(dl/fs),fs,duration:Math.floor(dl/fs)/fmt.sr};

   const o=i*w.fs+c*B;let v;
   if(w.tag===3)v=dv.getFloat32(o,true);
   else if(w.bits===16)v=dv.getInt16(o,true)/32768;
   else if(w.bits===8)v=(dv.getUint8(o)-128)/128;
   else if(w.bits===24){let x=dv.getUint8(o)|(dv.getUint8(o+1)<<8)|(dv.getUint8(o+2)<<16);if(x&0x800000)x|=~0xFFFFFF;v=x/8388608}

function cleanSegs(segs,filterHallu){

  if(filterHallu&&HALLU.test(t)&&t.length<90){dropped++;continue}
  const k=normT(t);
  run=(k&&k===prev)?run+1:1;prev=k;
  if(filterHallu&&run>2){dropped++;continue}   /* bucle Whisper: păstrăm cel mult 2 repetări la rând */

function chunksToSegs(chunks,offset,sliceEnd){

  const asr=await tf.pipeline('automatic-speech-recognition',gpu?M.gpu:M.wasm,gpu?{device:'webgpu',dtype:M.gd,progress_callback:cb}:{device:'wasm',dtype:'q8',progress_callback:cb});
  S.asr=asr;S.asrKey=key;S.dev=dev;return asr;
 }catch(e){
  if(gpu&&M.wasm){msg(tr('gpuFail',(e&&e.message)||e));S.gpuOK=false;return getAsr(mk,true)}
  throw e;
 }
}
async function transcribe(piece,lang,mk){
 const o={task:'transcribe',chunk_length_s:30,stride_length_s:5,return_timestamps:true};
 if(lang!=='auto')o.language=lang;
 try{return await S.asr(piece,o)}
 catch(e){
  if(S.dev==='webgpu'&&MODELS[mk].wasm){msg(tr('gpuTr'));S.asr=null;S.gpuOK=false;await getAsr(mk,true);return await S.asr(piece,o)}
  throw e;
 }
}

/* wake lock */
let wl=null;
async function lock(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(S.running&&document.visibilityState==='visible')lock()});
window.addEventListener('beforeunload',e=>{if(S.running){e.preventDefault();e.returnValue=''}});

function busy(b){S.running=b;$('go').disabled=b||!S.file;$('stop').disabled=!b;$('model').disabled=b;$('lang').disabled=b;$('file').disabled=b;$('prog').hidden=!b&&$('prog').value===0;upd()}
$('stop').onclick=()=>{S.cancel=true;$('stop').disabled=true;msg(tr('stopping'))};

$('go').onclick=async()=>{
 if(S.running||!S.file)return;
 $('errbox').hidden=true;
 const mk=$('model').value,lang=$('lang').value,filt=$('hallu').checked;
 let pos=0;
 if(S.segs.length){
  const done=(()=>{try{return JSON.parse(store.get(fkey())||'{}').done||0}catch(e){return 0}})();
  const k=await ask(tr('partQ',done?tr('partUntil',fmtT(done)):''),[tr('restart'),tr('cont')]);
  if(k===1&&done>0)pos=done;else{resetList();store.del(fkey())}
 }
 busy(true);S.cancel=false;await lock();
 $('prog').hidden=false;$('prog').value=0;
 try{
  msg(tr('analyzing'));
  if(!S.src)S.src=await openSource(S.file,msg);
  const dur=S.dur=S.src.duration;
  if(!(dur>0))throw new Error(tr('noDur'));
  $('finfo').textContent=tr('finfo',S.file.name,fmtMB(S.file.size),fmtDur(dur));
  const asr=await getAsr(mk);void asr;
  const N=S.dev==='webgpu'?240:120;
  const t0=performance.now(),p0=pos;let dropped=0;
  S.done=pos;
  while(pos<dur-0.2){
   if(S.cancel)break;
   const isLast=pos+N+10>=dur;
   const got=await S.src.getSlice(pos,Math.min(dur,pos+N+10));
   if(!got.audio.length){if(isLast)break;throw new Error(tr('decFail',fmtT(pos)))}
   const cut=isLast?got.audio.length:pickCut(got.audio,N*SR);
   const piece=got.audio.subarray(0,cut),sliceStart=got.start;
   msg(tr('transc',fmtT(sliceStart),fmtT(sliceStart+cut/SR),fmtT(dur)));
   if(rms(piece)>0.0005){
    const out=await transcribe(piece,lang,mk);
    const raw=chunksToSegs(out.chunks||[{text:out.text,timestamp:[0,cut/SR]}],sliceStart,sliceStart+cut/SR);
    const cl=cleanSegs(raw,filt);dropped+=cl.dropped;
    let add=cl.segs;
    if(filt&&S.segs.length&&add.length&&normT(add[0].t)===normT(S.segs[S.segs.length-1].t)){add=add.slice(1);dropped++}
    for(const g of add){S.segs.push(g);addRow(S.segs.length-1)}
    upd();
    const l=$('list');l.scrollTop=l.scrollHeight;
   }
   const adv=cut/SR;pos=Math.max(pos+1,sliceStart+adv);
   S.done=Math.min(pos,dur);saveNow();
   const frac=Math.min(1,pos/dur),el=(performance.now()-t0)/1000,rate=(pos-p0)/Math.max(0.1,el);
   $('prog').value=Math.round(frac*1000);
   if(rate>0&&!isLast)msg(tr('progEta',Math.round(frac*100),fmtT(pos),fmtT(dur),fmtDur((dur-pos)/rate)));
   await new Promise(r=>setTimeout(r));
  }
  if(S.cancel){msg(tr('stopped',fmtT(S.done)))}
  else{S.done=dur;saveNow();$('prog').value=1000;msg(dropped?tr('doneDrop',S.segs.length,dropped):tr('done',S.segs.length))}
 }catch(e){showErr(e,'pos='+pos+', model='+mk+', lang='+lang)}
 finally{try{wl&&wl.release()}catch(_){}wl=null;busy(false)}
};

/* export */
function baseName(){return(S.file?S.file.name:'transcriere').replace(/\.[^.]+$/,'')}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function cur(){return S.segs.filter(g=>g.t.trim())}
$('cp').onclick=async()=>{await copyText(buildTxt(cur(),$('withts').checked));msg(tr('txtCopied'))};
$('dtxt').onclick=()=>dl(new Blob([buildTxt(cur(),$('withts').checked)],{type:'text/plain;charset=utf-8'}),baseName()+'.txt');
$('dsrt').onclick=()=>dl(new Blob([buildSrt(cur())],{type:'application/x-subrip;charset=utf-8'}),baseName()+'.srt');
$('dvtt').onclick=()=>dl(new Blob([buildVtt(cur())],{type:'text/vtt;charset=utf-8'}),baseName()+'.vtt');
$('ddocx').onclick=()=>dl(buildDocx(cur(),tr('docTitle',baseName()),$('withts').checked),baseName()+'.docx');
applyLang();
})()}
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
